<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Flow Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f4f8;
      --surface: #ffffff;
      --card: rgba(255, 255, 255, 0.85);
      --card-hover: rgba(255, 255, 255, 0.95);
      --border: rgba(0, 0, 0, 0.06);
      --border-glow: rgba(255, 55, 95, 0.2);
      --accent: #ff375f;
      --accent-soft: #ff5e82;
      --accent-bg: rgba(255, 55, 95, 0.06);
      --green: #34c759;
      --red: #ff3b30;
      --yellow: #ffcc00;
      --cyan: #ff375f;
      --text: #0f172a;
      --text-dim: #475569;
      --muted: #94a3b8;
      --font: 'Inter', -apple-system, sans-serif;
      --mono: 'SF Mono', 'Fira Code', monospace;
      --radius: 12px;
    }

    html {
      height: 100%;
    }

    /* Header, tabs and the action bar stay put; only #content scrolls. */
    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 320px;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 55, 95, 0.04) 0%, var(--surface) 100%);
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 14px;
      right: 14px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 55, 95, 0.25), transparent);
    }

    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      box-shadow: 0 2px 6px rgba(255, 55, 95, 0.3);
    }

    .header-title {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    #btn-panel {
      padding: 5px 12px;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(255, 55, 95, 0.2);
    }

    .brand-sub { color:var(--muted); font-size:9px; font-weight:500; }
    #btn-settings { border:1px solid var(--border); width:30px; height:30px; border-radius:9px; background:#fff; color:var(--text-dim); cursor:pointer; font-size:14px; box-shadow:0 2px 8px rgba(15,23,42,.05); }
    .settings-pop { display:none; padding:10px 14px; background:#fff; border-bottom:1px solid var(--border); }
    .settings-pop.open { display:block; }
    .settings-card input { display:block; width:100%; height:40px; padding:0 12px; margin:0 0 12px; border:1px solid #dfe3eb; border-radius:10px; background:#fbfcfe; color:var(--text); font:600 11px var(--font); outline:none; transition:border-color .2s,box-shadow .2s,background .2s; }
    .settings-card input:focus { background:#fff; border-color:rgba(255,55,95,.55); box-shadow:0 0 0 3px rgba(255,55,95,.09); }
    #save-settings { width:100%; border:0; border-radius:10px; padding:11px; background:linear-gradient(135deg,#111827,#252c3c); color:#fff; font:700 11px var(--font); cursor:pointer; box-shadow:0 6px 16px rgba(15,23,42,.16); }

    #btn-panel:hover {
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      box-shadow: 0 3px 10px rgba(255, 55, 95, 0.3);
      transform: translateY(-1px);
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 6px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .log-actions { display:flex; align-items:center; gap:7px; }
    #clear-history { border:0; background:transparent; color:var(--accent); font:700 9px var(--font); cursor:pointer; }

    #log-count {
      background: var(--accent-bg);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-soft);
    }

    .log-empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .log-empty::before {
      content: '📋';
      display: block;
      font-size: 20px;
      margin-bottom: 6px;
      opacity: 0.4;
    }

    .entry {
      border-bottom: 1px solid rgba(30, 34, 53, 0.6);
    }

    .entry-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }

    .entry-row:hover {
      background: var(--accent-bg);
    }

    .entry-id {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      min-width: 54px;
      flex-shrink: 0;
    }

    .entry-type {
      flex: 1;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-time {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .badge-ok {
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
    }

    .badge-fail {
      background: rgba(244, 63, 94, 0.1);
      color: var(--red);
    }

    .badge-proc {
      background: rgba(245, 158, 11, 0.1);
      color: var(--yellow);
    }

    .expand-icon {
      font-size: 9px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .entry.open .expand-icon {
      transform: rotate(90deg);
    }

    .entry-details {
      display: none;
      padding: 0 14px 10px;
      background: var(--surface);
    }

    .entry.open .entry-details {
      display: block;
    }

    .detail-section {
      margin-top: 6px;
    }

    .detail-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .detail-value {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }

    .detail-value.url {
      color: var(--accent-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: none;
    }

    .detail-error {
      color: var(--red);
    }

    .quick-panel {
      padding: 14px;
      background: linear-gradient(180deg, #fff 0%, #fafbff 100%);
      border-bottom: 1px solid var(--border);
    }

    .quick-title { margin-bottom:12px; }
    .quick-title strong { display:block; font-size:15px; letter-spacing:-.02em; }
    .quick-title span { color:var(--muted); font-size:10px; }

    .health-row,
    .form-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .health-row { margin-left:auto; flex-direction:column; align-items:flex-end; justify-content:center; gap:4px; }

    .health-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 700;
    }

    .health-pill.status-only { width:9px; height:9px; padding:0; background:transparent; font-size:0; }
    .health-pill.status-only::before { width:9px; height:9px; box-shadow:0 0 0 4px rgba(52,199,89,.1); }

    .health-pill::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .health-pill.ok::before { background: var(--green); }
    .health-pill.bad::before { background: var(--red); }
    #quick-credits { margin-left: auto; font-weight: 800; color: var(--accent); }
    .header-badge { display:inline-flex; align-items:center; gap:6px; min-height:23px; padding:4px 8px; border:1px solid var(--border); border-radius:8px; background:#fff; box-shadow:0 2px 8px rgba(15,23,42,.05); white-space:nowrap; }
    header #quick-credits { margin-left:0; font-size:10px; }
    #monitor-client { color:var(--text-dim); font:700 9px var(--mono); }
    .account-badge { justify-content:center; }
    .badge-label { color:var(--muted); font-size:8px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .badge-value { color:var(--text); font-size:10px; font-weight:800; }
    #quick-credits.badge-value { color:var(--accent); }
    .header-token { margin-top:2px; color:var(--muted); font-size:9px; font-weight:600; }

    .quick-panel textarea,
    .quick-panel select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: 500 11px var(--font);
      outline: none;
    }

    .quick-panel textarea { min-height: 110px; resize: vertical; padding: 11px 12px; margin-bottom: 10px; line-height:1.55; }
    .quick-panel select { appearance:none; padding:9px 28px 9px 10px; background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%); background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%; background-size:4px 4px,4px 4px; background-repeat:no-repeat; }
    .form-row { margin-bottom: 8px; }
    .form-row > * { flex: 1; min-width: 0; }

    .type-switch { display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:3px; margin-bottom:8px; background:#eef1f6; border:1px solid var(--border); border-radius:11px; }
    .type-option { border:0; border-radius:8px; padding:8px; background:transparent; color:var(--muted); font:700 11px var(--font); cursor:pointer; }
    .type-option.active { color:#fff; background:linear-gradient(135deg,#171923,#2c3040); box-shadow:0 3px 8px rgba(15,23,42,.18); }
    .field-label { display:block; margin:0 0 5px 2px; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .field { flex:1; min-width:0; }
    .custom-select { position:relative; }
    .select-trigger { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text); font:600 10px var(--font); cursor:pointer; }
    .select-trigger::after { content:'⌄'; color:var(--muted); font-size:12px; }
    .custom-select.open .select-trigger { border-color:rgba(255,55,95,.45); box-shadow:0 0 0 3px rgba(255,55,95,.08); }
    .select-menu { display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:30; overflow:hidden; padding:4px; border:1px solid var(--border); border-radius:11px; background:#fff; box-shadow:0 14px 34px rgba(15,23,42,.18); }
    .custom-select.open .select-menu { display:grid; gap:2px; }
    .select-choice { border:0; border-radius:8px; padding:8px 9px; background:transparent; color:var(--text-dim); font:600 10px var(--font); text-align:left; cursor:pointer; }
    .select-choice:hover { background:#f5f7fa; }
    .select-choice.selected { background:var(--accent-bg); color:var(--accent); font-weight:800; }
    .select-choice:disabled { display:none; }

    #quick-generate {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: white;
      font: 700 11px var(--font);
      cursor: pointer;
      box-shadow:0 6px 16px rgba(255,55,95,.22);
    }

    #quick-generate:disabled { opacity: .55; cursor: wait; }
    #quick-result { margin-top:10px; font-size:10px; color:var(--text-dim); word-break:break-word; }
    .result-card { overflow:hidden; border:1px solid var(--border); border-radius:13px; background:#fff; box-shadow:0 8px 24px rgba(15,23,42,.08); }
    .result-preview { display:block; width:100%; max-height:220px; object-fit:cover; background:#eef1f5; }
    .result-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 11px; }
    .result-meta strong { color:var(--text); font-size:11px; }
    .result-open { flex-shrink:0; padding:7px 11px; border-radius:8px; background:var(--accent-bg); color:var(--accent); font-weight:800; text-decoration:none; }
    .tabs { flex-shrink:0; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:8px 10px; background:#fff; border-bottom:1px solid var(--border); }
    .tab { border:0; outline:0; border-radius:9px; padding:8px 6px; background:transparent; color:var(--muted); font:700 10px var(--font); cursor:pointer; }
    .tab:focus-visible { box-shadow:0 0 0 2px rgba(255,55,95,.2); }
    .tab.active { color:var(--accent); background:var(--accent-bg); box-shadow:inset 0 0 0 1px rgba(255,55,95,.12); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    #panel-history.active { background:#fff; }
    .log-header { position:sticky; top:0; z-index:2; }
    .settings-card { margin:14px; padding:14px; border:1px solid var(--border); border-radius:14px; background:#fff; box-shadow:0 8px 30px rgba(15,23,42,.06); }
    .settings-card h2 { font-size:14px; margin-bottom:3px; }
    .settings-card > p { color:var(--muted); font-size:10px; margin-bottom:14px; }
    .history-head { padding:14px 14px 8px; background:#fff; }
    .history-head strong { display:block; font-size:14px; }
    .history-head small { color:var(--muted); }
    .media-head { display:flex; align-items:center; justify-content:space-between; padding:14px; }
    .media-head strong { display:block; font-size:14px; }
    .media-head small { color:var(--muted); }
    #refresh-media { border:1px solid var(--border); border-radius:8px; padding:6px 9px; background:#fff; color:var(--text-dim); font:700 9px var(--font); cursor:pointer; }
    .media-actions { display:flex; gap:6px; }
    #delete-media { border:1px solid rgba(255,59,48,.25); border-radius:8px; padding:6px 9px; background:#fff; color:var(--red); font:700 9px var(--font); cursor:pointer; }
    #delete-media:hover { background:rgba(255,59,48,.06); }
    #delete-media:disabled { opacity:.5; cursor:wait; }
    .media-grid { display:grid; grid-template-columns:1fr; gap:12px; padding:0 14px 14px; }
    .media-item { overflow:hidden; border:1px solid var(--border); border-radius:12px; background:#fff; box-shadow:0 5px 18px rgba(15,23,42,.06); }
    .media-item img,.media-item video { display:block; width:100%; max-height:280px; aspect-ratio:16/9; object-fit:cover; background:#eef1f5; }
    .media-item > a { display:block; color:inherit; text-decoration:none; }
    .media-info { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 11px; }
    .media-copy { min-width:0; }
    .media-copy strong { display:block; color:var(--text); font-size:11px; }
    .media-copy span { display:block; overflow:hidden; margin-top:2px; color:var(--muted); font-size:8px; white-space:nowrap; text-overflow:ellipsis; }
    .media-view { flex-shrink:0; padding:7px 12px; border-radius:8px; background:var(--accent-bg); color:var(--accent); font-size:10px; font-weight:800; text-decoration:none; }
    .media-empty { grid-column:1/-1; padding:48px 15px; text-align:center; color:var(--muted); }
    .monitor { padding:14px; }
    .monitor-card { padding:14px; border:1px solid var(--border); border-radius:14px; background:#fff; box-shadow:0 8px 28px rgba(15,23,42,.06); }
    .monitor-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .monitor-state { display:flex; align-items:center; gap:8px; font-weight:800; }
    .monitor-dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
    .monitor-dot.on { background:var(--green); box-shadow:0 0 0 4px rgba(52,199,89,.12); }
    .agent-toggle { border:0; border-radius:999px; padding:7px 12px; color:#fff; background:#111827; font:800 9px var(--font); cursor:pointer; }
    .agent-toggle.on { background:var(--green); }
    .metrics-mini { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:12px; }
    .metric-mini { padding:11px 5px; border:1px solid var(--border); border-radius:10px; background:#fafbfc; text-align:center; }
    .metric-mini strong { display:block; font-size:18px; line-height:1.1; }
    .metric-mini span { color:var(--muted); font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    .token-card { display:flex; align-items:center; justify-content:space-between; padding:10px 11px; margin-bottom:10px; border-radius:10px; background:#f5f7fa; }
    #monitor-token { font-size:10px; font-weight:700; color:var(--text-dim); }
    .monitor-actions { flex-shrink:0; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 12px; background:#fff; border-top:1px solid var(--border); box-shadow:0 -8px 24px rgba(15,23,42,.06); }
    .monitor-actions button { border:1px solid var(--border); border-radius:9px; padding:9px; background:#fff; color:var(--text); font:700 10px var(--font); cursor:pointer; }
    .monitor-actions button.primary { border:0; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-soft)); }
    #toast { position:fixed; left:50%; bottom:72px; z-index:40; max-width:calc(100% - 28px); padding:9px 13px; border-radius:10px; background:#111827; color:#fff; font:700 10px var(--font); box-shadow:0 10px 30px rgba(15,23,42,.22); opacity:0; pointer-events:none; transform:translate(-50%,10px); transition:.2s ease; white-space:nowrap; }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    #toast.ok { background:#15803d; }
    #toast.error { background:#dc2626; }
  </style>
</head>

<body>
  <header>
    <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; overflow: visible; flex-shrink: 0; margin-right: 4px;">
      <img src="icon48.png" style="width: 100%; height: 100%; object-fit: contain; transform: scale(1.6); mix-blend-mode: multiply;">
    </div>
    <div class="header-title">Flow Agent<div class="header-token" id="monitor-token">No token</div></div>
    <div class="health-row">
      <span class="header-badge account-badge"><span class="badge-label">Device</span><span class="badge-value" id="monitor-client">—</span></span>
      <span class="header-badge account-badge"><span class="badge-label">Credits</span><span class="badge-value" id="quick-credits">—</span></span>
    </div>
  </header>

  <nav class="tabs" aria-label="Flow Agent sections">
    <button class="tab active" data-tab="create">Create</button>
    <button class="tab" data-tab="media">Media</button>
    <button class="tab" data-tab="history">Logs</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>

  <main id="content">
  <section class="tab-panel" id="panel-settings"><div class="settings-card">
    <h2>Connection settings</h2><p>Connect this extension to your Flow Agent backend.</p>
    <label class="field-label" for="setting-server">Backend server</label>
    <input id="setting-server" placeholder="flow.kodelyx.in" readonly title="Configured in config.js">
    <label class="field-label" for="setting-client">Client ID</label>
    <input id="setting-client" placeholder="My-Mac">
    <button id="save-settings">Save &amp; reconnect</button>
  </div></section>

  <section class="tab-panel" id="panel-media">
    <div class="media-head"><div><strong>Media library</strong><small>Backend and extension generations</small></div><div class="media-actions"><button id="refresh-media">Refresh</button><button id="delete-media" class="danger">Delete all</button></div></div>
    <div class="media-grid" id="media-grid"><div class="media-empty">Loading media…</div></div>
  </section>

  <section class="tab-panel active" id="panel-create"><div class="quick-panel">
    <div class="monitor-card" style="margin-bottom:14px">
      <div class="monitor-top"><div class="monitor-state"><span class="monitor-dot" id="monitor-dot"></span><span id="monitor-state">Checking…</span></div><button class="agent-toggle" id="agent-toggle">OFF</button></div>
      <div class="metrics-mini">
        <div class="metric-mini"><strong id="metric-total">0</strong><span>Total</span></div>
        <div class="metric-mini"><strong id="metric-success" style="color:var(--green)">0</strong><span>Success</span></div>
        <div class="metric-mini"><strong id="metric-failed" style="color:var(--red)">0</strong><span>Failed</span></div>
      </div>
    </div>
    <label class="field-label" for="quick-prompt">Prompt</label>
    <textarea id="quick-prompt" placeholder="Describe what you want to create…"></textarea>
    <div class="type-switch" role="group" aria-label="Generation type">
      <button class="type-option active" type="button" data-type="image">Image</button>
      <button class="type-option" type="button" data-type="video">Video</button>
      <input id="quick-type" type="hidden" value="image">
    </div>
    <div class="form-row">
      <div class="field" id="model-field"><label class="field-label">Model</label><input id="quick-model" type="hidden" value="gem_pix_2"><div class="custom-select" data-input="quick-model"><button class="select-trigger" type="button">Nano Banana 2</button><div class="select-menu"><button class="select-choice selected" data-value="gem_pix_2" type="button">Nano Banana 2</button><button class="select-choice" data-value="narwhal" type="button">Nano Banana</button><button class="select-choice" data-value="harbor_seal" type="button">Nano Banana Lite</button></div></div></div>
      <div class="field"><label class="field-label">Format</label><input id="quick-aspect" type="hidden" value="landscape"><div class="custom-select" data-input="quick-aspect"><button class="select-trigger" type="button">Landscape</button><div class="select-menu"><button class="select-choice selected" data-value="landscape" type="button">Landscape</button><button class="select-choice" data-value="portrait" type="button">Portrait</button><button class="select-choice" data-value="square" type="button">Square</button></div></div></div>
      <div class="field" id="duration-field" hidden><label class="field-label">Duration</label><input id="quick-duration" type="hidden" value="8"><div class="custom-select" data-input="quick-duration"><button class="select-trigger" type="button">8 sec</button><div class="select-menu"><button class="select-choice" data-value="4" type="button">4 sec</button><button class="select-choice" data-value="6" type="button">6 sec</button><button class="select-choice selected" data-value="8" type="button">8 sec</button><button class="select-choice" data-value="10" type="button">10 sec</button></div></div></div>
    </div>
    <button id="quick-generate">Generate with Flow</button>
    <div id="quick-result" aria-live="polite"></div>
  </div></section>

  <section class="tab-panel" id="panel-history">
  <div class="log-header">
    Request Logs
    <span class="log-actions"><button id="clear-history">Clear</button><span id="log-count">0</span></span>
  </div>

  <div id="log-list">
    <div class="log-empty">No requests yet</div>
  </div>

  </section>
  </main>

  <div class="monitor-actions"><button class="primary" id="open-flow">Open Flow</button><button id="refresh-token">Refresh Token</button></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
