name: Build Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build CLI and MCP
        run: |
          pyinstaller --clean --noconfirm flow-cli.spec
          pyinstaller --clean --noconfirm flow-mcp.spec

      - name: Rename binaries
        working-directory: dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv flow-cli.exe flow-cli-windows.exe
            mv flow-mcp.exe flow-mcp-windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv flow-cli flow-cli-macos
            mv flow-mcp flow-mcp-macos
          else
            mv flow-cli flow-cli-linux
            mv flow-mcp flow-mcp-linux
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.os }}
          path: dist/flow-*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/flow-*
