[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-agent"
version = "2.0.7"
description = "Programmable, OpenAI-compatible image & video generation on top of Google Flow, with an MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "cryptography>=42.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
flow = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["flow_server*", "flow_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
